name: Experimental OP13 Global ColorOS 17 source-fallback

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/update-state/op13-experimental-coloros17-source-fallback.json
      - configs/coloros17/OP13-GLOBAL-EXPERIMENTAL-6.6.118.json
      - manifests/coloros17/oneplus_13_global_cos17_source_fallback_6.6.118.xml
      - tests/op13-experimental-coloros17-contract-test.sh
      - .github/actions/build-kernel/**
      - .github/actions/kernel-source-sync/**
      - .github/workflows/build-op13-experimental-coloros17.yml

permissions:
  contents: read

concurrency:
  group: experimental-op13-cos17-source-fallback
  cancel-in-progress: true

jobs:
  build:
    name: Build experimental COS17 source-fallback
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_LOGFILE: ${{ github.workspace }}/ccache.log
      CCACHE_MAXSIZE: 5G
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: content
      CCACHE_NOHASHDIR: "true"
      CCACHE_COMPRESSION: "true"
      CCACHE_COMPRESSION_LEVEL: "3"
      CCACHE_DIRECT: "true"
      CCACHE_FILE_CLONE: "true"
      CCACHE_INODE_CACHE: "true"
      CCACHE_IS_KERNEL_COMPILING: "true"
      CCACHE_UMASK: "002"
      CCACHE_SLOPPINESS: file_macro,time_macros,include_file_mtime,include_file_ctime,pch_defines,system_headers,locale
      LDCACHE_DIR: ${{ github.workspace }}/.ldcache

    steps:
      - name: Checkout build definitions
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=3 update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git curl ca-certificates build-essential clang lld flex bison \
            libelf-dev libssl-dev libncurses-dev zlib1g-dev liblz4-tool \
            libxml2-utils rsync unzip dwarves file python3 ccache jq bc dos2unix \
            kmod libdw-dev elfutils pigz
          sudo apt-get clean
          mkdir -p "$CCACHE_DIR" "$LDCACHE_DIR"
          command -v ccache >/dev/null
          ccache --version

      - name: Validate experimental COS17 contract
        shell: bash
        run: |
          set -euo pipefail
          bash tests/op13-coloros17-prep-test.sh
          bash tests/op13-experimental-coloros17-contract-test.sh

      - name: Preflight exact fallback pins
        id: pins
        shell: bash
        run: |
          set -euo pipefail

          STATE_PATH=.github/update-state/op13-experimental-coloros17-source-fallback.json
          CONFIG_PATH=configs/coloros17/OP13-GLOBAL-EXPERIMENTAL-6.6.118.json
          MANIFEST_PATH=manifests/coloros17/oneplus_13_global_cos17_source_fallback_6.6.118.xml
          EXPECTED_RESUKISU_SHA=516d3e87fbc986ccefdde2c2765f1700612441a9
          EXPECTED_SUSFS_SHA=c7f670f57b7d43d75066b6657f8aee9cdf580d96
          EXPECTED_KERNEL_COMMON_SHA=e1b346b6b4f4096eb342ae3684838a942fd6f6c4
          EXPECTED_KERNEL_MODULES_SHA=d50b305f7da9e14715a25120a4ac7b1a4b8b97c3
          # KMI string reported by the stock ColorOS 17 CPH2653_11.H.05_3050
          # boot partition, and the UTS_RELEASE this build actually produces.
          EXPECTED_STOCK_KMI=6.6.118-android15-8-gc4127a25dcf3-ab15863337-4k
          EXPECTED_BUILT_UTS_RELEASE=6.6.118-android15

          [[ -f "$STATE_PATH" && -f "$CONFIG_PATH" && -f "$MANIFEST_PATH" ]] || {
            echo "::error::Missing experimental COS17 build input"
            exit 1
          }

          jq -e \
            --arg config "$CONFIG_PATH" \
            --arg manifest "$MANIFEST_PATH" \
            --arg resukisu "$EXPECTED_RESUKISU_SHA" \
            --arg susfs "$EXPECTED_SUSFS_SHA" \
            --arg common "$EXPECTED_KERNEL_COMMON_SHA" \
            --arg modules "$EXPECTED_KERNEL_MODULES_SHA" \
            --arg stock_kmi "$EXPECTED_STOCK_KMI" \
            --arg built_uts "$EXPECTED_BUILT_UTS_RELEASE" \
            '.validation.experimental == true
             and .validation.supported == false
             and .validation.publish_release == false
             and .validation.flash_permitted == true
             and .validation.requires_recovery_plan == true
             and .target.model == "CPH2653"
             and .target.firmware_family == "ColorOS"
             and .target.userspace_android_version == "android17"
             and .target.source_firmware_family == "OxygenOS"
             and .target.source_firmware_version == "16.0.9.401(EX01)"
             and .target.source_fallback == true
             and .target.kernel_kmi_android_generation == "android15"
             and .target.linux_kernel_version == "6.6.118"
             and .target.kmi == $stock_kmi
             and .target.built_kernel_uts_release == $built_uts
             and .target.kernel_driver_uapi_version == 6
             and .target.config == $config
             and .target.manifest == $manifest
             and .sources.resukisu.sha == $resukisu
             and .sources.susfs.sha == $susfs
             and .sources.kernel_common.sha == $common
             and .sources.kernel_modules.sha == $modules' \
            "$STATE_PATH" >/dev/null

          jq -e --arg manifest "$(basename "$MANIFEST_PATH")" \
            '.model == "OP13"
             and .os_version == "COS17"
             and .android_version == "android15"
             and .kernel_version == "6.6"
             and .manifest == $manifest
             and .susfs == true
             and .uname == "OP13-COS17-FALLBACK-RESUKISU"' \
            "$CONFIG_PATH" >/dev/null

          grep -F "revision=\"$EXPECTED_KERNEL_COMMON_SHA\"" "$MANIFEST_PATH" >/dev/null
          grep -F "revision=\"$EXPECTED_KERNEL_MODULES_SHA\"" "$MANIFEST_PATH" >/dev/null

          printf 'config_json=%s\n' "$(jq -c . "$CONFIG_PATH")" >> "$GITHUB_OUTPUT"
          printf 'resukisu_sha=%s\n' "$EXPECTED_RESUKISU_SHA" >> "$GITHUB_OUTPUT"
          printf 'susfs_sha=%s\n' "$EXPECTED_SUSFS_SHA" >> "$GITHUB_OUTPUT"
          printf 'stock_kmi=%s\n' "$EXPECTED_STOCK_KMI" >> "$GITHUB_OUTPUT"
          printf 'built_uts=%s\n' "$EXPECTED_BUILT_UTS_RELEASE" >> "$GITHUB_OUTPUT"

      - name: Build experimental COS17 kernel
        id: build
        uses: ./.github/actions/build-kernel
        with:
          op_config_json: ${{ steps.pins.outputs.config_json }}
          ksu_type: ReSukiSU
          ksu_branch_or_hash: ${{ steps.pins.outputs.resukisu_sha }}
          susfs_commit_hash_or_branch: ${{ steps.pins.outputs.susfs_sha }}
          clean: true
          debug: true
          artifact_slug: cos17-source-fallback
          archive_final_zip: false
          upload_final_zip: false
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify resolved immutable pins
        shell: bash
        env:
          EXPECTED_RESUKISU_SHA: ${{ steps.pins.outputs.resukisu_sha }}
          EXPECTED_SUSFS_SHA: ${{ steps.pins.outputs.susfs_sha }}
          ACTUAL_RESUKISU_SHA: ${{ steps.build.outputs.ksu_commit_sha }}
          ACTUAL_SUSFS_SHA: ${{ steps.build.outputs.susfs_commit_sha }}
        run: |
          set -euo pipefail
          [[ "$ACTUAL_RESUKISU_SHA" == "$EXPECTED_RESUKISU_SHA" ]] || {
            echo "::error::ReSukiSU/BakaSU HEAD differs from the approved fallback pin"
            exit 1
          }
          [[ "$ACTUAL_SUSFS_SHA" == "$EXPECTED_SUSFS_SHA" ]] || {
            echo "::error::SUSFS revision differs from the approved fallback pin"
            exit 1
          }

          # A successful compilation does not guarantee that the manager and
          # the embedded driver implement the same UAPI. Check the actual
          # checked-out BakaSU tree before publishing an experimental ZIP.
          kernel_uapi_header="$GITHUB_WORKSPACE/OP13/kernel_platform/KernelSU/uapi/supercall.h"
          [[ -f "$kernel_uapi_header" ]] || {
            echo "::error::BakaSU UAPI header missing from the kernel checkout"
            exit 1
          }
          if ! grep -Eq 'KERNEL_SU_UAPI_VERSION[[:space:]]*=[[:space:]]*6[[:space:]]*;' "$kernel_uapi_header"; then
            echo "::error::BakaSU driver UAPI is not 6; experimental COS17 manager contract would fail"
            exit 1
          fi

      - name: Stage explicitly experimental ZIP
        id: stage
        shell: bash
        env:
          ORIGINAL_ZIP: ${{ steps.build.outputs.zip_name }}
          ZIP_SHA256: ${{ steps.build.outputs.zip_sha256 }}
          IMAGE_SHA256: ${{ steps.build.outputs.image_sha256 }}
          KERNEL_VERSION: ${{ steps.build.outputs.kernel_version }}
          RESUKISU_SHA: ${{ steps.build.outputs.ksu_commit_sha }}
          SUSFS_SHA: ${{ steps.build.outputs.susfs_commit_sha }}
          STOCK_KMI: ${{ steps.pins.outputs.stock_kmi }}
          EXPECTED_BUILT_UTS_RELEASE: ${{ steps.pins.outputs.built_uts }}
        run: |
          set -euo pipefail

          source_zip="$GITHUB_WORKSPACE/OP13/artifacts/$ORIGINAL_ZIP"
          [[ -f "$source_zip" ]] || {
            echo "::error::Built ZIP missing: $source_zip"
            exit 1
          }

          staged_name="EXPERIMENTAL-COS17-CPH2653-SOURCE-FALLBACK-$ORIGINAL_ZIP"
          staged_zip="$GITHUB_WORKSPACE/$staged_name"
          cp -- "$source_zip" "$staged_zip"

          actual_sha256="$(sha256sum "$staged_zip" | awk '{print $1}')"
          [[ "$actual_sha256" == "$ZIP_SHA256" ]] || {
            echo "::error::Staged ZIP SHA-256 mismatch"
            exit 1
          }

          # KernelSU Kernel Flash expects a real AnyKernel3 ZIP, not an outer
          # GitHub Actions archive containing another ZIP and a text notice.
          unzip -tq "$staged_zip" >/dev/null || {
            echo "::error::Generated AnyKernel3 ZIP failed archive integrity check"
            exit 1
          }
          entries_file="$RUNNER_TEMP/cos17-ak3-zip-entries.txt"
          unzip -Z -1 "$staged_zip" > "$entries_file"
          for required in \
            META-INF/com/google/android/update-binary \
            META-INF/com/google/android/updater-script \
            anykernel.sh \
            tools/ak3-core.sh \
            Image; do
            if ! grep -Fxq "$required" "$entries_file"; then
              echo "::error::Not a flashable AnyKernel3 ZIP: missing $required"
              exit 1
            fi
          done

          # Verify the kernel identity of the image that is actually shipped.
          # A green build is not proof that the image carries the expected
          # version string, so read it back out of the staged ZIP.
          image_file="$RUNNER_TEMP/cos17-kernel-image"
          unzip -p "$staged_zip" Image > "$image_file" || {
            echo "::error::Could not extract Image from the staged ZIP"
            exit 1
          }
          actual_image_sha256="$(sha256sum "$image_file" | awk '{print $1}')"
          [[ "$actual_image_sha256" == "$IMAGE_SHA256" ]] || {
            echo "::error::Image SHA-256 in the staged ZIP does not match the build output"
            exit 1
          }
          built_vermagic="$(grep -a -o -m 1 -E '[0-9]+\.[0-9]+\.[0-9]+-android15[^[:space:]]* SMP preempt mod_unload modversions aarch64' "$image_file" || true)"
          expected_vermagic="$EXPECTED_BUILT_UTS_RELEASE SMP preempt mod_unload modversions aarch64"
          [[ "$built_vermagic" == "$expected_vermagic" ]] || {
            echo "::error::Built kernel vermagic is '$built_vermagic', expected '$expected_vermagic'"
            exit 1
          }
          built_banner="$(grep -a -o -m 1 -E 'Linux version [^[:space:]]+ \([^)]*\)' "$image_file" || true)"
          echo "Built kernel vermagic: $built_vermagic"
          echo "Built kernel banner  : $built_banner"

          notice="$GITHUB_WORKSPACE/EXPERIMENTAL-COS17-SOURCE-FALLBACK-NOTICE.txt"
          cat > "$notice" <<EOF
          EXPERIMENTAL / UNVERIFIED COLOROS 17 SOURCE-FALLBACK BUILD
          =========================================================

          Device target: OnePlus 13 Global CPH2653
          Userspace target label: ColorOS 17 / Android 17
          Firmware analysed: CPH2653_11.H.05_3050 (V17.0.0, Android 17)
          Kernel source origin: OxygenOS 16.0.9.401(EX01)
          Kernel baseline: android15 / Linux 6.6.118
          Stock ColorOS 17 kernel: $STOCK_KMI
          Built kernel UTS_RELEASE: $built_vermagic
          Built kernel banner: $built_banner
          Common source: e1b346b6b4f4096eb342ae3684838a942fd6f6c4
          Modules source: d50b305f7da9e14715a25120a4ac7b1a4b8b97c3
          ReSukiSU/BakaSU: $RESUKISU_SHA
          Kernel driver UAPI: 6 (manager must be UAPI 6)
          SUSFS: $SUSFS_SHA
          Built kernel version: $KERNEL_VERSION
          Image SHA-256: $IMAGE_SHA256
          ZIP SHA-256: $ZIP_SHA256

          This is NOT built from official CPH2653 ColorOS 17 kernel sources.
          It is only a compatibility test using the last published matching
          CPH2653 OxygenOS source baseline. Keep a recovery path available.

          The exported symbol CRCs of this build were verified to be identical
          to the stock ColorOS 17 kernel for every symbol the stock
          vendor_dlkm modules import. The kernel version string differs from
          the stock one, but AOSP ignores the version part of vermagic for
          modules that carry a CRC table, so the stock vendor modules load.
          EOF

          printf 'staged_name=%s\n' "$staged_name" >> "$GITHUB_OUTPUT"
          printf 'notice=%s\n' "$notice" >> "$GITHUB_OUTPUT"

      - name: Upload flashable AnyKernel3 ZIP directly (no double ZIP)
        uses: actions/upload-artifact@v7
        with:
          path: ${{ github.workspace }}/${{ steps.stage.outputs.staged_name }}
          archive: false
          if-no-files-found: error
          retention-days: 30

      - name: Upload experimental source-fallback notice separately
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.stage.outputs.notice }}
          archive: false
          if-no-files-found: error
          retention-days: 30
