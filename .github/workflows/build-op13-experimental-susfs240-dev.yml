name: Diagnostic OP13 SUSFS 2.4 and BakaSU dev

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_LOGFILE: ${{ github.workspace }}/ccache.log
      CCACHE_MAXSIZE: 5G
      CCACHE_BASEDIR: ${{ github.workspace }}
      LDCACHE_DIR: ${{ github.workspace }}/.ldcache
    steps:
      - name: Checkout build definitions
        uses: actions/checkout@v6

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=3 update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git curl ca-certificates build-essential clang lld flex bison \
            libelf-dev libssl-dev libncurses-dev zlib1g-dev lz4 \
            libxml2-utils rsync unzip zip dwarves file python3 python3-requests ccache jq bc dos2unix \
            kmod libdw-dev elfutils pigz aria2 cpio
          mkdir -p "$CCACHE_DIR" "$LDCACHE_DIR"

      - name: Resolve diagnostic sources
        id: pins
        shell: bash
        run: |
          set -euo pipefail
          dev_sha="$(git ls-remote https://github.com/Baka-SU/BakaSU.git refs/heads/dev | awk '{print $1}')"
          [[ "$dev_sha" =~ ^[0-9a-f]{40}$ ]] || { echo '::error::Cannot resolve BakaSU dev HEAD'; exit 1; }
          config=configs/coloros17/OP13-GLOBAL-EXPERIMENTAL-6.6.118.json
          manifest=manifests/coloros17/oneplus_13_global_cos17_source_fallback_6.6.118.xml
          jq -e '.model == "OP13" and .os_version == "COS17" and .android_version == "android15" and .kernel_version == "6.6" and .susfs == true' "$config" >/dev/null
          grep -F 'revision="e1b346b6b4f4096eb342ae3684838a942fd6f6c4"' "$manifest" >/dev/null
          grep -F 'revision="d50b305f7da9e14715a25120a4ac7b1a4b8b97c3"' "$manifest" >/dev/null
          echo "dev_sha=$dev_sha" >> "$GITHUB_OUTPUT"
          echo "config_json=$(jq -c . "$config")" >> "$GITHUB_OUTPUT"
          echo "::warning::Diagnostic only: ColorOS 17 uses OxygenOS source fallback; do not flash or publish"

      - name: Build diagnostic kernel
        id: build
        uses: ./.github/actions/build-kernel
        with:
          op_config_json: ${{ steps.pins.outputs.config_json }}
          ksu_type: ReSukiSU
          ksu_branch_or_hash: ${{ steps.pins.outputs.dev_sha }}
          susfs_commit_hash_or_branch: f98f08223bbf469cc0a1542166383d253557fc32
          experimental_susfs_240: 'true'
          clean: true
          debug: true
          artifact_slug: susfs240-dev-diagnostic
          upload_final_zip: false
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify resolved sources and driver UAPI
        shell: bash
        env:
          EXPECTED_DEV: ${{ steps.pins.outputs.dev_sha }}
          ACTUAL_DEV: ${{ steps.build.outputs.ksu_commit_sha }}
          ACTUAL_SUSFS: ${{ steps.build.outputs.susfs_commit_sha }}
          ACTUAL_VERSION: ${{ steps.build.outputs.susfs_version }}
        run: |
          set -euo pipefail
          [[ "$ACTUAL_DEV" == "$EXPECTED_DEV" ]]
          [[ "$ACTUAL_SUSFS" == f98f08223bbf469cc0a1542166383d253557fc32 && "$ACTUAL_VERSION" == v2.4.0 ]]
          grep -Eq 'KERNEL_SU_UAPI_VERSION[[:space:]]*=[[:space:]]*6[[:space:]]*;' "$GITHUB_WORKSPACE/OP13/kernel_platform/KernelSU/uapi/supercall.h" || { echo '::error::Driver UAPI differs from 6; manager compatibility is unverified'; exit 1; }
          echo "BakaSU dev SHA: $ACTUAL_DEV; SUSFS: $ACTUAL_SUSFS; driver UAPI: 6"
          echo '::warning::A matching manager APK and device compatibility have not been verified'
